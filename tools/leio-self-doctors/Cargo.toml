[package]
name = "leio-self-doctors"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
leio-code = { path = "../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
regex = "1"
sha2 = "0.10"
ignore = "0.4"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.debugging]
inherits = "dev"
debug = 2
split-debuginfo = "unpacked"


[profile.dev.package.leio-code]
opt-level = 0
debug = "line-tables-only"
