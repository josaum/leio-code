<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">A map for your coding agent</title><desc id="desc">A request flows through ranked context and exact code relationships into a persistent navigation session. Illustrative product diagram.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#152331"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#59e3c0"/></marker></defs>
<rect width="1200" height="580" rx="24" fill="url(#bg)"/>
<text x="54" y="65" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#59e3c0">LEIO CODE  /  LOCAL REPOSITORY INTELLIGENCE</text>
<text x="54" y="132" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#ffffff">Turn “where do I start?”</text>
<text x="54" y="186" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#ffffff">into a path you can follow.</text>
<rect x="54" y="250" width="250" height="184" rx="14" fill="#122433" stroke="#365161"/>
<text x="74" y="285" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#59e3c0">01</text>
<text x="74" y="315" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#91acbf">THE REQUEST</text>
<text x="74" y="359" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Describe the change</text>
<text x="74" y="391" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#dce6ef">“Fix payment validation”</text>
<path d="M308 340H327" fill="none" stroke="#59e3c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="334" y="250" width="250" height="184" rx="14" fill="#122433" stroke="#365161"/>
<text x="354" y="285" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#59e3c0">02</text>
<text x="354" y="315" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#91acbf">THE WORKING SET</text>
<text x="354" y="359" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Find useful files</text>
<text x="354" y="391" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#dce6ef">Bounded, ranked context</text>
<path d="M588 340H607" fill="none" stroke="#59e3c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="614" y="250" width="250" height="184" rx="14" fill="#122433" stroke="#365161"/>
<text x="634" y="285" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#59e3c0">03</text>
<text x="634" y="315" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#91acbf">THE RELATIONSHIPS</text>
<text x="634" y="359" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Follow the code</text>
<text x="634" y="391" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#dce6ef">Symbols · callers · imports</text>
<path d="M868 340H887" fill="none" stroke="#59e3c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="894" y="250" width="250" height="184" rx="14" fill="#122433" stroke="#365161"/>
<text x="914" y="285" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#59e3c0">04</text>
<text x="914" y="315" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#91acbf">THE SESSION</text>
<text x="914" y="359" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Keep your place</text>
<text x="914" y="391" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#dce6ef">Select · back · forward</text>
<path d="M54 478H1146" stroke="#365161"/>
<text x="54" y="517" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">18 stdio tools</text>
<text x="340" y="517" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#dce6ef">Repository-local evidence</text>
<text x="710" y="517" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#dce6ef">JSON-LD provenance</text>
<text x="54" y="550" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#91acbf">Illustrative workflow. Indexed evidence guides inspection; it does not prove runtime behavior.</text>
