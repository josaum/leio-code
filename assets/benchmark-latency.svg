<text x="410.6" y="268.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">9.5 ms</text>
<text x="45" y="307" font-family="Arial,sans-serif" font-size="17" fill="#c3c2b7">Find export_code_graph</text>
<path d="M355.0 320.0 H716.8 Q720.8 320.0 720.8 324.0 V336.0 Q720.8 340.0 716.8 340.0 H355.0 Z" fill="#199e70"/>
<text x="730.8" y="336.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">76.2 ms</text>
