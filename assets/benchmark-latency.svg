<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Local CLI lookup latency</title><desc id="desc">Ten repetitions per task. LEIO medians: 103.9, 92.7 and 117 milliseconds. ripgrep: 11.5, 10.7 and 12.1 milliseconds. Different output types; no equivalent-workload speedup claim.</desc><rect width="1000" height="480" rx="20" fill="#07111e"/>
<text x="40" y="49" font-family="Arial,sans-serif" font-size="28" fill="#ffffff">Local query latency. Measured, not promised.</text>
<text x="40" y="81" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">Median wall-clock milliseconds · 10 runs/task · existing index · lower is faster</text>
<text x="40" y="140" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">Find query_dead_code</text>
