<line x1="355" y1="470" x2="1075" y2="470" stroke="#898781" stroke-width="1"/>
<text x="45" y="535" font-family="Arial,sans-serif" font-size="14" fill="#898781">Ten repetitions per task · existing index · complete samples and exit codes in the benchmark receipt</text>
</svg>
