<text x="782.55" y="136" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">103.9</text>
<rect x="300" y="150" width="51.75" height="20" rx="3" fill="#91acbf"/>
<text x="366.75" y="166" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">11.5</text>
<text x="40" y="240" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">Find export_code_graph</text>
<rect x="300" y="220" width="417.15000000000003" height="20" rx="3" fill="#59e3c0"/>
<text x="732.1500000000001" y="236" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">92.7</text>
<rect x="300" y="250" width="48.15" height="20" rx="3" fill="#91acbf"/>
<text x="363.15" y="266" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">10.7</text>
<text x="40" y="340" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">Context: RDF namespace</text>
<rect x="300" y="320" width="526.5" height="20" rx="3" fill="#59e3c0"/>
<text x="841.5" y="336" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">117.0</text>
<rect x="300" y="350" width="54.449999999999996" height="20" rx="3" fill="#91acbf"/>
<text x="369.45" y="366" font-family="Arial,sans-serif" font-size="16" fill="#dce6ef">12.1</text>
