[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leio-code"
version = "2.6.5"
description = "Prebuilt Leio Code and Leio Harness"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
keywords = ["leio", "leio-code", "leio-harness"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/josaum/leio-code"
Repository = "https://github.com/josaum/leio-code"
Changelog = "https://github.com/josaum/leio-code/releases/tag/leio-code-plugin-v2.6.5"

[project.scripts]
leio-code = "leio_code._exec:code"
leio-harness = "leio_code._exec:harness"
leio-mcp = "leio_code.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leio_code = ["bin/*", "mcp/**/*", "register-mcp.js"]
