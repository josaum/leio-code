# fly.toml — LEIO Code Keycloak issuer

app = "leio-code-keycloak"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  KEYCLOAK_HOSTNAME_URL = "https://leio-code-keycloak.fly.dev"

[[mounts]]
  source = "keycloak_data"
  destination = "/opt/keycloak/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
