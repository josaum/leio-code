name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: leio-code-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leio-code-ci-clippy
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leio-code-ci-tests
      - name: Test workspace
        run: cargo test --workspace --locked

  harness-coverage:
    name: Harness coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leio-code-ci-harness-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Enforce harness line coverage
        run: cargo llvm-cov -p leio-harness --locked --summary-only --fail-under-lines 87
