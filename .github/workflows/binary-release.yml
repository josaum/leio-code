name: Windows installation preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Windows installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      REVISION: ef250fd439049df03fbe73125b630d9b3b114383
      VERSION: 2.7.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: 45838893701
          name: release-assets
          path: release-assets
      - name: Install test client
        id: prepare
        working-directory: mcp
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify wheel, npm and desktop installs
        shell: bash
        run: |
          python scripts/smoke_release_packages.py --assets-dir release-assets \
            --version "$VERSION" --revision "$REVISION" --wheel-tag win_amd64
      - name: Verify portable package
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dumpbin was not found' }
          python scripts/smoke_windows_release.py "release-assets/leio-code-${env:VERSION}-windows-amd64-portable.zip" `
            --dumpbin "$dumpbin" --version "$env:VERSION" --revision "$env:REVISION"
