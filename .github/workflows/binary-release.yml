name: Binary release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leio-code-plugin-v*)."
        required: false
        type: string
  push:
    tags:
      - "leio-code-plugin-v*"

concurrency:
  group: leio-code-binary-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          INPUT_TAG="${{ inputs.tag }}"
          TAG="${INPUT_TAG:-leio-code-plugin-v${VERSION}}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: leio-code-linux-amd64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: leio-code-darwin-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: leio-code-darwin-amd64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: leio-code-windows-amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leio-code-binary-${{ matrix.target }}
      - name: Build release binary
        shell: bash
        env:
          RUSTC_WRAPPER: ""
          CARGO_TARGET_DIR: target
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p leio-code -p leio-harness
          cp "target/${{ matrix.target }}/release/leio-code${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/leio-harness${{ matrix.ext }}" "${{ matrix.asset_name }}-harness${{ matrix.ext }}"
      - name: Strip binary
        shell: bash
        run: |
          if [ -z "${{ matrix.ext }}" ] && command -v strip >/dev/null; then
            strip "${{ matrix.asset_name }}${{ matrix.ext }}" "${{ matrix.asset_name }}-harness${{ matrix.ext }}" || true
          fi
      - name: Smoke release binaries
        shell: bash
        run: |
          "./${{ matrix.asset_name }}${{ matrix.ext }}" --version
          "./${{ matrix.asset_name }}-harness${{ matrix.ext }}" --version
      - name: Checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset_name }}${{ matrix.ext }}" > "${{ matrix.asset_name }}${{ matrix.ext }}.sha256"
            shasum -a 256 "${{ matrix.asset_name }}-harness${{ matrix.ext }}" > "${{ matrix.asset_name }}-harness${{ matrix.ext }}.sha256"
          else
            sha256sum "${{ matrix.asset_name }}${{ matrix.ext }}" > "${{ matrix.asset_name }}${{ matrix.ext }}.sha256"
            sha256sum "${{ matrix.asset_name }}-harness${{ matrix.ext }}" > "${{ matrix.asset_name }}-harness${{ matrix.ext }}.sha256"
          fi
      - name: Ensure release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve-tag.outputs.release_tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "LEIO Code v${{ needs.resolve-tag.outputs.version }}" \
              --notes "Binary release for leio-code v${{ needs.resolve-tag.outputs.version }}" \
              --draft || true
          fi
          gh release upload "$TAG" \
            "${{ matrix.asset_name }}${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}.sha256" \
            "${{ matrix.asset_name }}-harness${{ matrix.ext }}" "${{ matrix.asset_name }}-harness${{ matrix.ext }}.sha256" --clobber
